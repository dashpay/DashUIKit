name: Select Xcode
description: Select the Xcode that CI builds DashUIKit with.

inputs:
  version:
    # Swift tools 6.3 (Package.swift) needs Xcode 26.4 or newer.
    description: Xcode version, as in /Applications/Xcode_<version>.app on the runner image.
    default: "26.6"

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.version }}
      run: |
        sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
        xcodebuild -version
        swift --version
