name: "Check PR title format"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

# pull_request_target gets a write token by default; the action only reads the PR.
permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure which types are allowed (newline delimited).
          # Default: https://github.com/commitizen/conventional-commit-types
          # Our specific types (from https://github.com/dashpay/dash/blob/master/CONTRIBUTING.md#contributor-workflow)
          types: |
            design
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            trivial
            backport
