name: CI

# After a stacked PR is retargeted (e.g. its feat/* base merged), push a commit or
# close and reopen it: a base change fires only `edited`, which this workflow does not
# listen to, because CodeRabbit's body edits would rebuild on every one of them.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # One group per commit on master, so a burst of merges does not cancel the
  # queued run of the commit in the middle.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "Build: iOS device + macOS"
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # Release for devices is what ships. The Debug simulator build (previews
      # included) happens in Test.
      - name: Build Release
        run: |
          xcodebuild -scheme DashUIKit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build

      # The documented local build; also compiles the macOS/AppKit branches.
      - name: Build for macOS
        run: swift build

  test:
    name: Unit tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # On the simulator, not macOS: UIKit-only files are compiled out on macOS.
      # Without -quiet so the failure reason and the executed-test count are in the log;
      # no diagnostics collection, which adds ~10 minutes to every failing run.
      - name: Run tests
        run: |
          udid=$(.github/scripts/pick-simulator.sh)
          xcodebuild -scheme DashUIKit \
            -destination "platform=iOS Simulator,id=${udid}" \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            test

  snapshots:
    name: Snapshot tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # The PR head, not the merge with master: the references it records are committed
      # to the branch, so they must show the branch's own code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # swift-snapshot-testing pulls swift-syntax into the graph; keep the clones.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: snapshot-packages-${{ hashFiles('SnapshotTests/Package.resolved') }}

      # The references are rendered here and only compared here (docs/snapshot-tests.md).
      # REQUIRE turns a runner on another iOS runtime into a failure, not a skip.
      # RECORD=failed rewrites a missing or changed reference in the checkout and still
      # fails the test; the next step uploads the rewritten set for
      # .github/scripts/fetch-snapshots.sh.
      - name: Run snapshot tests
        working-directory: SnapshotTests
        env:
          PACKAGES: ${{ runner.temp }}/SourcePackages
          TEST_RUNNER_SNAPSHOT_REQUIRE_REFERENCE_ENVIRONMENT: "1"
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: failed
        run: |
          udid=$(../.github/scripts/pick-simulator.sh)
          xcodebuild -scheme DashUIKitSnapshotTests-Package \
            -destination "platform=iOS Simulator,id=${udid}" \
            -clonedSourcePackagesDirPath "$PACKAGES" \
            -testLanguage en -testRegion US \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload re-recorded references
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: SnapshotTests/Tests/DashUIKitSnapshotTests/__Snapshots__
          if-no-files-found: ignore
          # A re-run of the job replaces the set of the earlier attempt.
          overwrite: true
          retention-days: 14

  conventions:
    name: "Conventions: assets, colors, strings"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Asset catalog ↔ DashIcon / Color.dash, asset and string bundles, hardcoded
      # colors, @available at or below the floor (see the script header).
      - name: Check conventions
        run: .github/scripts/conventions.sh

      # Breaks a copy of the tree once per rule, so a rule that stops matching fails here.
      # It needs a clean baseline, so it runs only when the check above passed.
      - name: Test the conventions script
        run: .github/scripts/tests/conventions-test.sh

      # The PR-description check runs from the base branch, so its rules are tested here,
      # also when a conventions step above failed.
      - name: Test the Before / After screenshots check
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 .github/scripts/tests/screenshots-test.py

  actionlint:
    name: Lint CI config (actionlint, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint ships no action. Dependabot cannot see this pin: bump it by hand.
      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint

      - name: Run actionlint
        run: ./actionlint -color

      # actionlint only checks inline run: blocks.
      - name: Run shellcheck on scripts
        run: shellcheck .github/scripts/*.sh .github/scripts/tests/*.sh
